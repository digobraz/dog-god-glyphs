    <!-- Consent Mode v2 defaults — MUSIA byť pred GTM snippetom (Vlna C).
         Všetko denied; consent.ts po voľbe v banneri (Vlna B) pošle gtag('consent','update').
         Vracajúcemu userovi obnovíme uloženú voľbu synchronne z localStorage PRED GTM tagmi,
         nech GA4/Pixel nečakajú na React mount. Kľúč `dogypt_consent` = zhodný s consent.ts. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      try {
        var _c = JSON.parse(localStorage.getItem('dogypt_consent') || 'null');
        if (_c) gtag('consent', 'update', {
          analytics_storage: _c.analytics ? 'granted' : 'denied',
          ad_storage:        _c.marketing ? 'granted' : 'denied',
          ad_user_data:      _c.marketing ? 'granted' : 'denied',
          ad_personalization:_c.marketing ? 'granted' : 'denied'
        });
      } catch (e) {}
    </script>
    <!-- Google Tag Manager -->

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PXB5MV3L');</script>

    <!-- canonical + og:url zámerne NIE statické: rieši ich per-route <Seo> (react-helmet-async), inak by statická home hodnota kolidovala s per-route canonical (Google by mohol canonicalizovať sub-stránky na home). Home sa self-canonicalizuje. -->

    <!-- Google Fonts moved here from src/index.css @import (was render-blocking the whole
         stylesheet parse). Only the families/weights actually used across the app
         (Cinzel, Cinzel Decorative, Inter, Space Grotesk, JetBrains Mono).
         media="print" + onload swap = non-blocking load (PageSpeed 2026-07-08: 1750ms
         "žiadosti o blokovanie vykreslenia"); text still shows via display=swap fallback
         font in the meantime, no CLS since app already renders CLS=0. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
