T · Legal</p><h1 class="lg-h1" style="font-family: Cinzel, serif; font-weight: 700; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase;">Privacy Policy</h1><p class="lg-meta">Last updated: 11 October 2026 · v1.3</p><p class="lg-note">This document is provided in multiple languages for convenience. If the versions differ, the English version prevails.</p></header><ol class="lg-toc" style="background: linear-gradient(135deg, rgb(251, 245, 230) 0%, rgb(242, 226, 189) 100%); border: 1px solid rgb(201, 154, 63); border-radius: 12px; box-shadow: rgba(122, 90, 42, 0.1) 0px 1px 3px, rgba(255, 255, 255, 0.4) 0px 1px 0px inset;"><li><button type="button"><i>1</i><span>Who We Are</span></button></li><li><button type="button"><i>2</i><span>Data We Collect</span></button></li><li><button type="button"><i>3</i><span>How We Use It</span></button></li><li><button type="button"><i>4</i><span>Legal Basis (GDPR)</span></button></li><li><button type="button"><i>5</i><span>Sharing &amp; Sub-processors</span></button></li><li><button type="button"><i>6</i><span>Cookies &amp; Tracking</span></button></li><li><button type="button"><i>7</i><span>Retention</span></button></li><li><button type="button"><i>8</i><span>Your Rights</span></button></li><li><button type="button"><i>9</i><span>International Transfers</span></button></li><li><button type="button"><i>10</i><span>Changes to This Policy</span></button></li><li><button type="button"><i>11</i><span>Contact</span></button></li><li><button type="button"><i>12</i><span>Inside the Pack: What Other Members See</span></button></li><li><button type="button"><i>13</i><span>Messages &amp; Reports</span></button></li><li><button type="button"><i>14</i><span>AINUBIS, Our AI Guide</span></button></li></ol><div class="lg-sections"><section id="privacy-1" class="lg-sec"><h2><i>1</i>Who We Are</h2><p>DOGYPT s.r.o., a Slovak limited liability company (IČO 54 444 594), registered seat Jaslovské Bohunice 335, 919 30 Jaslovské Bohunice, Slovakia. We are the controller of the personal data described below. For any privacy-related question write to woof@dogypt.com. We have not appointed a Data Protection Officer because our processing does not meet the GDPR Art. 37 thresholds. Effective date: 4 May 2026.</p></section><section id="privacy-2" class="lg-sec"><h2><i>2</i>Data We Collect</h2><p>When you use the HEROGLYPH flow we collect: your email address, your dog’s name, the photo of your dog you upload (stored on Cloudinary), the symbolic answers you select (gender, colour, fate, bloodline, character, your zodiac, your initial), and your dog’s birth date if provided. Stripe collects your payment details directly — we receive only a payment confirmation, the last 4 digits of the card, and country. Our servers automatically log technical data (IP address, user-agent, request time) for security and abuse prevention. We also collect usage data about how you move through the site (pages viewed, clicks, device and browser type) — anonymised by default, and tied to you only if you consent to analytics or recordings. If you are a Pack member we also store what you create inside the Pack: your profile answers, your dog’s profile, the trips you log or announce (route, location, date, and any photos you upload), your ratings, comments and questions, your messages with other Members, and any reports you send.</p></section><section id="privacy-3" class="lg-sec"><h2><i>3</i>How We Use It</h2><p>We use your data to: generate and deliver your HEROGLYPH certificate; send you the certificate email and a small number of follow-up Pack messages; display your dog’s entry in the public GodsGrid (only the dog’s name, photo, and HEROGLYPH symbol appear publicly — never your email, your name, or your private code); operate, secure, and improve the Service; comply with legal obligations such as accounting and consumer protection.</p></section><section id="privacy-4" class="lg-sec"><h2><i>4</i>Legal Basis (GDPR)</h2><p>We rely on Art. 6(1)(b) GDPR (performance of a contract) for the HEROGLYPH delivery and Pack membership; Art. 6(1)(a) (consent) for marketing email beyond service messages, for session recordings and identified analytics, and for advertising cookies — you can withdraw any of these at any time; Art. 6(1)(f) (legitimate interest) for security logging, abuse prevention, and anonymous aggregate analytics; and Art. 6(1)(c) (legal obligation) for tax and accounting records.</p></section><section id="privacy-5" class="lg-sec"><h2><i>5</i>Sharing &amp; Sub-processors</h2><p>We do not sell your data. We share it only with sub-processors that help us run the Service: Stripe Payments Europe, Ltd. (payments) · Cloudinary Ltd. (photo storage and delivery) · Resend, Inc. (transactional email) · Supabase, Inc. (database and authentication) · Anthropic, PBC (the Claude model behind the AINUBIS chat, see Section 14) · Cloudflare, Inc. (hosting of dogypt.com and DNS) · WebSupport s.r.o. (hosting of subdomains, domain) · Telegram (internal notifications to the founder about AINUBIS conversations and reports) · GitHub, Inc. (deployment pipeline) · PostHog (EU-hosted product analytics). Only if you give marketing consent do we also engage Google Ireland Ltd. (Google Analytics 4) and Meta Platforms Ireland Ltd. (Meta Pixel) to measure campaigns and build advertising audiences. Each sub-processor is bound by its own data processing agreement.</p></section><section id="privacy-6" class="lg-sec"><h2><i>6</i>Cookies &amp; Tracking</h2><p>We keep cookies and local storage to the minimum needed to make the Service work — session, language, and your in-progress HEROGLYPH selections. For product analytics we use PostHog, hosted in the EU. By default it runs in a cookieless, anonymised mode — no cross-site tracking and no advertising, the Plausible-style model — on the basis of our legitimate interest in finding and fixing what breaks. Only if you consent do we enable identified analytics and session recordings; and, separately, advertising cookies such as Google Analytics 4 and the Meta Pixel, which measure campaigns and build marketing audiences. You can grant or withdraw either of these at any time through “Cookie settings” in the footer. All analytics data is processed on EU servers.</p></section><section id="privacy-7" class="lg-sec"><h2><i>7</i>Retention</h2><p>Your HEROGLYPH and Pack profile are kept for as long as your account exists, because the GodsGrid is the lifetime registry of every member of the Pack. Transactional email logs are kept for 12 months for support and fraud prevention. Accounting records are kept for 10 years as required by Slovak law (Act 431/2002 Coll.). When you ask us to delete your account, we remove personal identifiers within 30 days and keep only the legally required minimum. Messages are kept while the conversation exists and go with your account when you delete it, except for the copy in the other participant’s thread. Reports and the moderation record are kept while the reporting account exists, so we can recognise repeat behaviour.</p></section><section id="privacy-8" class="lg-sec"><h2><i>8</i>Your Rights</h2><p>Under GDPR you have the right to access your data, to correct it, to have it erased, to restrict or object to processing, to data portability, and to withdraw consent at any time. You can also lodge a complaint with the Slovak supervisory authority — Úrad na ochranu osobných údajov SR, Hraničná 12, 820 07 Bratislava 27, statny.dozor@pdp.gov.sk. To exercise any of these rights write to woof@dogypt.com — we reply within 30 days.</p></section><section id="privacy-9" class="lg-sec"><h2><i>9</i>International Transfers</h2><p>Some of our sub-processors (Stripe, Cloudinary, Resend, Supabase, Anthropic, Cloudflare, Telegram, GitHub, and — with marketing consent — Google and Meta) operate servers outside the EU/EEA, mostly in the United States. PostHog processes our analytics on EU servers. Where personal data leaves the EU/EEA we rely on the European Commission’s Standard Contractual Clauses, the EU–US Data Privacy Framework, and additional safeguards required by GDPR Chapter V.</p></section><section id="privacy-10" class="lg-sec"><h2><i>10</i>Changes to This Policy</h2><p>We will tell you about material changes by email at least 30 days before they take effect. Minor edits — typos, sub-processor name updates, new contact addresses — take effect on publication. The current version and date are always at the top of this page; older versions are available on request.</p></section><section id="privacy-11" class="lg-sec"><h2><i>11</i>Contact</h2><p>woof@dogypt.com · Postal: DOGYPT s.r.o., Jaslovské Bohunice 335, 919 30 Jaslovské Bohunice, Slovakia.</p></section><section id="privacy-12" class="lg-sec"><h2><i>12</i>Inside the Pack: What Other Members See</h2><p>Section 3 describes the public GodsGrid. Inside the Pack — the member-only area — other signed-in Members see more: your first name, your Dogyptian number, your dog’s name and photo, the attributes you filled in about your dog, the trips you logged or announced, your ratings and comments, and whatever you wrote on your profile. They do not see your email address, your postal address, your payment data, or your messages with anyone else. When you announce a trip as open, the trail, the date and your dog become visible to every Member so they can ask to join — that is what announcing it means. A trip you keep private is visible only to you and to the people already going. You choose which of the two it is, and you can change it at any time.</p></section><section id="privacy-13" class="lg-sec"><h2><i>13</i>Messages &amp; Reports</h2><p>Private messages between Members are stored in our database (Supabase) so conversations survive between sessions. Legal basis: Art. 6(1)(b) GDPR — they are part of the membership you paid for. We do not read them routinely and never use them for advertising or profiling. We open a conversation only when it is reported, when we investigate a specific abuse or security incident, or when the law requires it. A report stores the reason you picked, your optional note, and a reference to what you reported — not a separate copy of it. Blocking is stored as a pair of member identifiers. If you delete your account your messages go with it; the copy in the other person’s thread stays, shown as coming from a removed member, because that conversation is also theirs.</p></section><section id="privacy-14" class="lg-sec"><h2><i>14</i>AINUBIS, Our AI Guide</h2><p>AINUBIS is the AI guide inside DOGYPT. Its answers are generated by Claude, a model made by Anthropic, PBC, which acts as our sub-processor. When you are signed in, every message you send to AINUBIS goes to Anthropic together with: the name on your profile, the names and basic details of your dogs, their DOG ID details (character, health, feeding), the latest entries in their diary, and a short summary of your earlier conversations with AINUBIS. AINUBIS never receives your dog’s will or the contacts of other people you entered in the DOG ID (vet, backup contact, heir). Anthropic receives this data only to generate the reply and does not use it to train its models. If you are not signed in, AINUBIS knows only what you type in the chat and any screenshot you attach.

You will be able to switch off each part — dogs, DOG ID, diary and memory — in the AINUBIS settings. AINUBIS then works only with what you tell it in the conversation.

Your conversations with AINUBIS, including attached screenshots, are stored in our database (Supabase) as ordinary history. Hiding or clearing a conversation in the chat removes it from your view, not from our records; the history is deleted when you ask us to delete your account. Unlike messages between Members (Section 13), AINUBIS conversations are not closed to us: the founder, Matej Stacho, reads them and can reply in them himself. Legal basis: Art. 6(1)(b) GDPR for Members — AINUBIS is part of the membership; for visitors who are not signed in, our legitimate interest in answering their question (Art. 6(1)(f)).</p></section></div><footer class="lg-foot"><p class="lg-motto" style="font-family: &quot;Space Grotesk&quot;, sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;">DOGYPT · In DOG We Trust</p><a class="lg-other" href="/terms">Terms of Service →</a></footer></article><p class="lg-copy">© 2026 DOGYPT</p></main></div></template><template data-pre-consent="en"><div class="consent-banner" role="dialog" aria-live="polite" aria-label="Human duties"><div class="consent-inner"><div><p class="consent-body"><img class="consent-bone" src="/icons/pack/bone.svg" alt="" aria-hidden="true"><b>Human duties</b>The only cookies we recommend aren’t for eating — they help us improve our website. Thank you.</p></div><div class="consent-actions"><div class="consent-split"><button type="button" class="consent-split-main">Only necessary</button><button type="button" class="consent-split-arrow" aria-haspopup="menu" aria-expanded="false" aria-label="Choose"><span class="consent-arrow-ic" aria-hidden="true"><svg viewBox="0 0 462.85 462.851" width="16" height="16" fill="currentColor" focusable="false" aria-hidden="true"><path d="M380.44,70.332c-0.376-4.936-3.362-9.46-7.663-12.781c-20.216-15.615-39.745-32.078-58.676-49.234

ia: 11. októbra 2026 · v1.3</p><p class="lg-note">Tento dokument poskytujeme vo viacerých jazykoch pre pohodlie. V prípade rozdielov medzi verziami má prednosť anglické znenie.</p></header><ol class="lg-toc" style="background: linear-gradient(135deg, rgb(251, 245, 230) 0%, rgb(242, 226, 189) 100%); border: 1px solid rgb(201, 154, 63); border-radius: 12px; box-shadow: rgba(122, 90, 42, 0.1) 0px 1px 3px, rgba(255, 255, 255, 0.4) 0px 1px 0px inset;"><li><button type="button"><i>1</i><span>Kto sme</span></button></li><li><button type="button"><i>2</i><span>Aké údaje zbierame</span></button></li><li><button type="button"><i>3</i><span>Ako ich používame</span></button></li><li><button type="button"><i>4</i><span>Právny základ (GDPR)</span></button></li><li><button type="button"><i>5</i><span>Zdieľanie a sprostredkovatelia</span></button></li><li><button type="button"><i>6</i><span>Cookies a sledovanie</span></button></li><li><button type="button"><i>7</i><span>Uchovávanie údajov</span></button></li><li><button type="button"><i>8</i><span>Vaše práva</span></button></li><li><button type="button"><i>9</i><span>Medzinárodné prenosy</span></button></li><li><button type="button"><i>10</i><span>Zmeny týchto zásad</span></button></li><li><button type="button"><i>11</i><span>Kontakt</span></button></li><li><button type="button"><i>12</i><span>Vo vnútri svorky: čo vidia ostatní členovia</span></button></li><li><button type="button"><i>13</i><span>Správy a nahlásenia</span></button></li><li><button type="button"><i>14</i><span>AINUBIS, náš AI sprievodca</span></button></li></ol><div class="lg-sections"><section id="privacy-1" class="lg-sec"><h2><i>1</i>Kto sme</h2><p>DOGYPT s.r.o., slovenská spoločnosť s ručením obmedzeným (IČO 54 444 594), sídlo Jaslovské Bohunice 335, 919 30 Jaslovské Bohunice, Slovensko. Sme prevádzkovateľom osobných údajov opísaných nižšie. S akoukoľvek otázkou o súkromí nám píšte na woof@dogypt.com. Zodpovednú osobu (DPO) sme nevymenovali, pretože naše spracúvanie nedosahuje prahové hodnoty čl. 37 GDPR. Dátum účinnosti: 4. mája 2026.</p></section><section id="privacy-2" class="lg-sec"><h2><i>2</i>Aké údaje zbierame</h2><p>Pri používaní HEROGLYPH procesu zbierame: vašu e-mailovú adresu, meno psa, nahranú fotografiu psa (uloženú na Cloudinary), symbolické odpovede, ktoré vyberiete (pohlavie, farba, osud, pokrvná línia, charakter, váš horoskop, vaša iniciála), a dátum narodenia psa, ak ho uvediete. Platobné údaje zbiera priamo Stripe — my dostávame len potvrdenie platby, posledné 4 číslice karty a krajinu. Naše servery automaticky zaznamenávajú technické údaje (IP adresa, user-agent, čas požiadavky) na účely bezpečnosti a prevencie zneužitia. Zbierame aj údaje o používaní o tom, ako sa pohybujete po stránke (zobrazené stránky, kliknutia, typ zariadenia a prehliadača) — predvolene anonymizované a priradené k vám len vtedy, ak udelíte súhlas s analytikou alebo nahrávaniami. Ak ste členom svorky, ukladáme aj to, čo vo svorke vytvoríte: odpovede vo vašom profile, profil vášho psa, výlety, ktoré zaznamenáte alebo ohlásite (trasa, miesto, dátum a fotografie, ktoré nahráte), vaše hodnotenia, komentáre a otázky, vaše správy s ostatnými Členmi a nahlásenia, ktoré nám pošlete.</p></section><section id="privacy-3" class="lg-sec"><h2><i>3</i>Ako ich používame</h2><p>Vaše údaje používame na: vygenerovanie a doručenie HEROGLYPH certifikátu; odoslanie e-mailu s certifikátom a malého počtu nadväzujúcich správ svorky; zobrazenie záznamu vášho psa vo verejnom GodsGrid (verejne sa zobrazuje len meno psa, fotografia a HEROGLYPH symbol — nikdy nie váš e-mail, vaše meno ani súkromný kód); prevádzku, zabezpečenie a zlepšovanie Služby; plnenie zákonných povinností, ako sú účtovníctvo a ochrana spotrebiteľa.</p></section><section id="privacy-4" class="lg-sec"><h2><i>4</i>Právny základ (GDPR)</h2><p>Opierame sa o čl. 6 ods. 1 písm. b) GDPR (plnenie zmluvy) pri dodaní HEROGLYPHu a členstve vo svorke; čl. 6 ods. 1 písm. a) (súhlas) pri marketingových e-mailoch nad rámec servisných správ, pri nahrávaní relácií a identifikovanej analytike a pri reklamných cookies — ktorýkoľvek z nich môžete kedykoľvek odvolať; čl. 6 ods. 1 písm. f) (oprávnený záujem) pri bezpečnostnom logovaní, prevencii zneužitia a anonymnej agregovanej analytike; a čl. 6 ods. 1 písm. c) (zákonná povinnosť) pri daňových a účtovných záznamoch.</p></section><section id="privacy-5" class="lg-sec"><h2><i>5</i>Zdieľanie a sprostredkovatelia</h2><p>Vaše údaje nepredávame. Zdieľame ich len so sprostredkovateľmi, ktorí nám pomáhajú prevádzkovať Službu: Stripe Payments Europe, Ltd. (platby) · Cloudinary Ltd. (ukladanie a doručovanie fotografií) · Resend, Inc. (transakčné e-maily) · Supabase, Inc. (databáza a autentifikácia) · Anthropic, PBC (model Claude, na ktorom beží chat AINUBIS, pozri článok 14) · Cloudflare, Inc. (hosting dogypt.com a DNS) · WebSupport s.r.o. (hosting subdomén, doména) · Telegram (interné upozornenia zakladateľovi o rozhovoroch s AINUBISOM a hláseniach) · GitHub, Inc. (nasadzovanie) · PostHog (produktová analytika hostovaná v EÚ). Len ak udelíte marketingový súhlas, zapojíme aj Google Ireland Ltd. (Google Analytics 4) a Meta Platforms Ireland Ltd. (Meta Pixel) na meranie kampaní a budovanie reklamných publík. Každý sprostredkovateľ je viazaný vlastnou zmluvou o spracúvaní údajov.</p></section><section id="privacy-6" class="lg-sec"><h2><i>6</i>Cookies a sledovanie</h2><p>Cookies a lokálne úložisko udržiavame na minime potrebnom na fungovanie Služby — relácia, jazyk a rozpracované HEROGLYPH voľby. Na produktovú analytiku používame PostHog, hostovaný v EÚ. Predvolene beží v režime bez cookies a anonymizovane — bez sledovania naprieč stránkami a bez reklamy, model v štýle Plausible — na základe nášho oprávneného záujmu nájsť a opraviť to, čo nefunguje. Len ak udelíte súhlas, zapneme identifikovanú analytiku a nahrávanie relácií; a samostatne reklamné cookies, ako sú Google Analytics 4 a Meta Pixel, ktoré merajú kampane a budujú marketingové publiká. Ktorýkoľvek z týchto súhlasov môžete kedykoľvek udeliť alebo odvolať cez „Nastavenia cookies" v pätičke. Všetky analytické údaje sa spracúvajú na serveroch v EÚ.</p></section><section id="privacy-7" class="lg-sec"><h2><i>7</i>Uchovávanie údajov</h2><p>Váš HEROGLYPH a profil svorky uchovávame, kým existuje váš účet, pretože GodsGrid je doživotný register každého člena svorky. Záznamy o transakčných e-mailoch uchovávame 12 mesiacov na účely podpory a prevencie podvodov. Účtovné záznamy uchovávame 10 rokov, ako vyžaduje slovenské právo (zákon č. 431/2002 Z. z.). Keď požiadate o vymazanie účtu, osobné identifikátory odstránime do 30 dní a ponecháme len zákonom vyžadované minimum. Správy uchovávame, kým existuje konverzácia, a pri zmazaní účtu odídú s ním, okrem kópie vo vlákne druhého účastníka. Nahlásenia a záznam o moderovaní uchovávame, kým existuje účet nahlasovateľa, aby sme vedeli rozpoznať opakované správanie.</p></section><section id="privacy-8" class="lg-sec"><h2><i>8</i>Vaše práva</h2><p>Podľa GDPR máte právo na prístup k svojim údajom, ich opravu, vymazanie, obmedzenie spracúvania alebo námietku proti nemu, prenosnosť údajov a kedykoľvek odvolať súhlas. Sťažnosť môžete podať aj slovenskému dozornému orgánu — Úrad na ochranu osobných údajov SR, Hraničná 12, 820 07 Bratislava 27, statny.dozor@pdp.gov.sk. Na uplatnenie ktoréhokoľvek z týchto práv napíšte na woof@dogypt.com — odpovieme do 30 dní.</p></section><section id="privacy-9" class="lg-sec"><h2><i>9</i>Medzinárodné prenosy</h2><p>Niektorí naši sprostredkovatelia (Stripe, Cloudinary, Resend, Supabase, Anthropic, Cloudflare, Telegram, GitHub a — pri marketingovom súhlase — Google a Meta) prevádzkujú servery mimo EÚ/EHP, väčšinou v USA. PostHog spracúva našu analytiku na serveroch v EÚ. Tam, kde osobné údaje opúšťajú EÚ/EHP, sa opierame o štandardné zmluvné doložky Európskej komisie, rámec EÚ–USA Data Privacy Framework a dodatočné záruky podľa kapitoly V GDPR.</p></section><section id="privacy-10" class="lg-sec"><h2><i>10</i>Zmeny týchto zásad</h2><p>O podstatných zmenách vás budeme informovať e-mailom najmenej 30 dní pred nadobudnutím účinnosti. Drobné úpravy — preklepy, zmeny názvov sprostredkovateľov, nové kontaktné adresy — nadobúdajú účinnosť zverejnením. Aktuálna verzia a dátum sú vždy v hornej časti tejto stránky; staršie verzie sú dostupné na požiadanie.</p></section><section id="privacy-11" class="lg-sec"><h2><i>11</i>Kontakt</h2><p>woof@dogypt.com · Pošta: DOGYPT s.r.o., Jaslovské Bohunice 335, 919 30 Jaslovské Bohunice, Slovensko.</p></section><section id="privacy-12" class="lg-sec"><h2><i>12</i>Vo vnútri svorky: čo vidia ostatní členovia</h2><p>Článok 3 opisuje verejný GodsGrid. Vo vnútri svorky — v členskej zóne — vidia ostatní prihlásení Členovia viac: vaše krstné meno, vaše dogyptské poradové číslo, meno a fotografiu vášho psa, atribúty, ktoré ste o psovi vyplnili, výlety, ktoré ste zaznamenali alebo ohlásili, vaše hodnotenia a komentáre a čokoľvek ste napísali na svoj profil. Nevidia vašu e-mailovú adresu, poštovú adresu, platobné údaje ani vaše správy s kýmkoľvek iným. Keď ohlásite výlet ako otvorený, trasa, dátum a váš pes sa stanú viditeľnými pre každého Člena, aby mohol požiadať o pridanie — to ohlásenie znamená. Výlet, ktorý si necháte súkromný, vidíte len vy a ľudia, ktorí už idú. Ktorá z tých dvoch možností to bude, si vyberáte vy a môžete to kedykoľvek zmeniť.</p></section><section id="privacy-13" class="lg-sec"><h2><i>13</i>Správy a nahlásenia</h2><p>Súkromné správy medzi Členmi sa ukladajú v našej databáze (Supabase), aby konverzácie prežili medzi reláciami. Právny základ: čl. 6 ods. 1 písm. b) GDPR — sú súčasťou členstva, ktoré ste si zaplatili. Bežne ich nečítame a nikdy ich nepoužívame na reklamu ani profilovanie. Konverzáciu otvoríme len vtedy, keď je nahlásená, keď vyšetrujeme konkrétne zneužitie alebo bezpečnostný incident, alebo keď to vyžaduje zákon. Nahlásenie ukladá dôvod, ktorý ste vybrali, vašu voliteľnú poznámku a odkaz na to, čo ste nahlásili — nie samostatnú kópiu. Blokovanie sa ukladá ako dvojica identifikátorov členov. Ak si zmažete účet, vaše správy odídú s ním; kópia vo vlákne druhej osoby ostáva, zobrazená ako od odstráneného člena, pretože tá konverzácia je aj jej.</p></section><section id="privacy-14" class="lg-sec"><h2><i>14</i>AINUBIS, náš AI sprievodca</h2><p>AINUBIS je AI sprievodca vo vnútri DOGYPTu. Jeho odpovede generuje Claude, model spoločnosti Anthropic, PBC, ktorá je naším sprostredkovateľom. Keď ste prihlásení, s každou vašou správou pre AINUBISA odchádza do Anthropicu aj: meno z vášho profilu, mená a základné údaje vašich psov, údaje z ich DOG ID (povaha, zdravie, kŕmenie), posledné zápisy z ich denníka a krátky výťah z vašich predošlých rozhovorov s AINUBISOM. AINUBIS nikdy nedostane závet vášho psa ani kontakty iných ľudí, ktoré ste zapísali do DOG ID (veterinár, záložný kontakt, dedič). Anthropic tieto údaje dostáva len na vygenerovanie odpovede a nepoužíva ich na trénovanie svojich modelov. Ak prihlásení nie ste, AINUBIS vie len to, čo mu napíšete do chatu, a snímku obrazovky, ak ju priložíte.

Každú z týchto častí — psy, DOG ID, denník a pamäť — si budete môcť vypnúť v nastaveniach AINUBISA. AINUBIS potom pracuje len s tým, čo mu poviete v rozhovore.

Rozhovory s AINUBISOM vrátane priložených snímok uchovávame v našej databáze (Supabase) ako bežnú históriu. Keď si rozhovor v chate skryjete alebo vymažete, zmizne z vášho pohľadu, nie z našich záznamov; históriu zmažeme, keď nás požiadate o zrušenie účtu. Na rozdiel od správ medzi Členmi (článok 13) nie sú rozhovory s AINUBISOM pred nami zatvorené: zakladateľ Matej Stacho ich číta a môže do nich sám odpovedať. Právny základ: pri Členoch čl. 6 ods. 1 písm. b) GDPR — AINUBIS je súčasťou členstva; pri neprihlásených návštevníkoch náš oprávnený záujem odpovedať na ich otázku (čl. 6 ods. 1 písm. f)).</p></section></div><footer class="lg-foot"><p class="lg-motto" style="font-family: &quot;Space Grotesk&quot;, sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;">DOGYPT · Veríme v psa</p><a class="lg-other" href="/terms">Podmienky používania →</a></footer></article><p class="lg-copy">© 2026 DOGYPT</p></main></div></template><template data-pre-consent="sk"><div class="consent-banner" role="dialog" aria-live="polite" aria-label="Ľudské povinnosti"><div class="consent-inner"><div><p class="consent-body"><img class="consent-bone" src="/icons/pack/bone.svg" alt="" aria-hidden="true"><b>Ľudské povinnosti</b>Jediné cookies, ktoré odporúčame, nie sú na jedenie — pomáhajú nám vylepšovať web. Ďakujeme.</p></div><div class="consent-actions"><div class="consent-split"><button type="button" class="consent-split-main">Len nevyhnutné</button><button type="button" class="consent-split-arrow" aria-haspopup="menu" aria-expanded="false" aria-label="Vybrať si"><span class="consent-arrow-ic" aria-hidden="true"><svg viewBox="0 0 462.85 462.851" width="16" height="16" fill="currentColor" focusable="false" aria-hidden="true"><path d="M380.44,70.332c-0.376-4.936-3.362-9.46-7.663-12.781c-20.216-15.615-39.745-32.078-58.676-49.234

h hodnot čl. 37 GDPR. Datum účinnosti: 4. května 2026.</p></section><section id="privacy-2" class="lg-sec"><h2><i>2</i>Jaké údaje sbíráme</h2><p>Při používání HEROGLYPH procesu sbíráme: vaši e-mailovou adresu, jméno psa, nahranou fotografii psa (uloženou na Cloudinary), symbolické odpovědi, které vyberete (pohlaví, barva, osud, pokrevní linie, charakter, váš horoskop, vaše iniciála), a datum narození psa, pokud jej uvedete. Platební údaje sbírá přímo Stripe — my dostáváme jen potvrzení platby, poslední 4 číslice karty a zemi. Naše servery automaticky zaznamenávají technické údaje (IP adresa, user-agent, čas požadavku) pro účely bezpečnosti a prevence zneužití. Sbíráme také údaje o používání o tom, jak se pohybujete po webu (zobrazené stránky, kliknutí, typ zařízení a prohlížeče) — ve výchozím nastavení anonymizované a přiřazené k vám jen tehdy, pokud udělíte souhlas s analytikou nebo nahráváním.</p></section><section id="privacy-3" class="lg-sec"><h2><i>3</i>Jak je používáme</h2><p>Vaše údaje používáme k: vygenerování a doručení HEROGLYPH certifikátu; odeslání e-mailu s certifikátem a malého počtu navazujících zpráv smečky; zobrazení záznamu vašeho psa ve veřejném GodsGrid (veřejně se zobrazuje jen jméno psa, fotografie a HEROGLYPH symbol — nikdy ne váš e-mail, vaše jméno ani soukromý kód); provozu, zabezpečení a zlepšování Služby; plnění zákonných povinností, jako jsou účetnictví a ochrana spotřebitele.</p></section><section id="privacy-4" class="lg-sec"><h2><i>4</i>Právní základ (GDPR)</h2><p>Opíráme se o čl. 6 odst. 1 písm. b) GDPR (plnění smlouvy) při dodání HEROGLYPHu a členství ve smečce; čl. 6 odst. 1 písm. a) (souhlas) u marketingových e-mailů nad rámec servisních zpráv, u nahrávání relací a identifikované analytiky a u reklamních cookies — kterýkoli z nich můžete kdykoli odvolat; čl. 6 odst. 1 písm. f) (oprávněný zájem) u bezpečnostního logování, prevence zneužití a anonymní agregované analytiky; a čl. 6 odst. 1 písm. c) (zákonná povinnost) u daňových a účetních záznamů.</p></section><section id="privacy-5" class="lg-sec"><h2><i>5</i>Sdílení a zpracovatelé</h2><p>Vaše údaje neprodáváme. Sdílíme je jen se zpracovateli, kteří nám pomáhají provozovat Službu: Stripe Payments Europe, Ltd. (platby) · Cloudinary Ltd. (ukládání a doručování fotografií) · Resend, Inc. (transakční e-maily) · Supabase, Inc. (databáze a autentizace) · Anthropic, PBC (model Claude, na kterém běží chat AINUBIS, viz článek 14) · Cloudflare, Inc. (hosting dogypt.com a DNS) · WebSupport s.r.o. (hosting subdomén, doména) · Telegram (interní upozornění zakladateli o rozhovorech s AINUBISEM a hlášeních) · GitHub, Inc. (nasazování) · PostHog (produktová analytika hostovaná v EU). Pouze pokud udělíte marketingový souhlas, zapojíme také Google Ireland Ltd. (Google Analytics 4) a Meta Platforms Ireland Ltd. (Meta Pixel) k měření kampaní a budování reklamních publik. Každý zpracovatel je vázán vlastní smlouvou o zpracování údajů.</p></section><section id="privacy-6" class="lg-sec"><h2><i>6</i>Cookies a sledování</h2><p>Cookies a lokální úložiště udržujeme na minimu potřebném k fungování Služby — relace, jazyk a rozpracované HEROGLYPH volby. K produktové analytice používáme PostHog, hostovaný v EU. Ve výchozím nastavení běží v režimu bez cookies a anonymizovaně — bez sledování napříč weby a bez reklamy, model ve stylu Plausible — na základě našeho oprávněného zájmu najít a opravit to, co nefunguje. Pouze pokud udělíte souhlas, zapneme identifikovanou analytiku a nahrávání relací; a samostatně reklamní cookies, jako jsou Google Analytics 4 a Meta Pixel, které měří kampaně a budují marketingová publika. Kterýkoli z těchto souhlasů můžete kdykoli udělit nebo odvolat přes „Nastavení cookies" v patičce. Všechna analytická data se zpracovávají na serverech v EU.</p></section><section id="privacy-7" class="lg-sec"><h2><i>7</i>Uchovávání údajů</h2><p>Váš HEROGLYPH a profil smečky uchováváme, dokud existuje váš účet, protože GodsGrid je doživotní registr každého člena smečky. Záznamy o transakčních e-mailech uchováváme 12 měsíců pro účely podpory a prevence podvodů. Účetní záznamy uchováváme 10 let, jak vyžaduje slovenské právo (zákon č. 431/2002 Z. z.). Když požádáte o smazání účtu, osobní identifikátory odstraníme do 30 dnů a ponecháme jen zákonem vyžadované minimum.</p></section><section id="privacy-8" class="lg-sec"><h2><i>8</i>Vaše práva</h2><p>Podle GDPR máte právo na přístup ke svým údajům, jejich opravu, výmaz, omezení zpracování nebo námitku proti němu, přenositelnost údajů a kdykoli odvolat souhlas. Stížnost můžete podat také slovenskému dozorovému orgánu — Úrad na ochranu osobných údajov SR, Hraničná 12, 820 07 Bratislava 27, statny.dozor@pdp.gov.sk. K uplatnění kteréhokoli z těchto práv pište na woof@dogypt.com — odpovíme do 30 dnů.</p></section><section id="privacy-9" class="lg-sec"><h2><i>9</i>Mezinárodní přenosy</h2><p>Někteří naši zpracovatelé (Stripe, Cloudinary, Resend, Supabase, Anthropic, Cloudflare, Telegram, GitHub a — při marketingovém souhlasu — Google a Meta) provozují servery mimo EU/EHP, většinou v USA. PostHog zpracovává naši analytiku na serverech v EU. Tam, kde osobní údaje opouštějí EU/EHP, se opíráme o standardní smluvní doložky Evropské komise, rámec EU–USA Data Privacy Framework a dodatečné záruky podle kapitoly V GDPR.</p></section><section id="privacy-10" class="lg-sec"><h2><i>10</i>Změny těchto zásad</h2><p>O podstatných změnách vás budeme informovat e-mailem nejméně 30 dní před nabytím účinnosti. Drobné úpravy — překlepy, změny názvů zpracovatelů, nové kontaktní adresy — nabývají účinnosti zveřejněním. Aktuální verze a datum jsou vždy v horní části této stránky; starší verze jsou k dispozici na vyžádání.</p></section><section id="privacy-11" class="lg-sec"><h2><i>11</i>Kontakt</h2><p>woof@dogypt.com · Pošta: DOGYPT s.r.o., Jaslovské Bohunice 335, 919 30 Jaslovské Bohunice, Slovensko.</p></section><section id="privacy-12" class="lg-sec"><h2><i>12</i>Uvnitř smečky: co vidí ostatní Členové</h2><p>Článek 3 popisuje veřejný GodsGrid. Uvnitř smečky — v členské zóně — vidí ostatní přihlášení Členové více: vaše křestní jméno, vaše dogyptské pořadové číslo, jméno a fotografii vašeho psa, atributy, které jste o psovi vyplnili, výlety, které jste zaznamenali nebo ohlásili, vaše hodnocení a komentáře a cokoli jste napsali na svůj profil. Nevidí vaši e-mailovou adresu, poštovní adresu, platební údaje ani vaše zprávy s kýmkoli jiným. Když ohlásíte výlet jako otevřený, trasa, datum a váš pes se stanou viditelnými pro každého Člena, aby mohl požádat o přidání — to ohlášení znamená. Výlet, který si necháte soukromý, vidíte jen vy a lidé, kteří už jdou. Která z těch dvou možností to bude, si vybíráte vy a můžete to kdykoli změnit.</p></section><section id="privacy-13" class="lg-sec"><h2><i>13</i>Zprávy a nahlášení</h2><p>Soukromé zprávy mezi Členy se ukládají v naší databázi (Supabase), aby konverzace přežily mezi relacemi. Právní základ: čl. 6 odst. 1 písm. b) GDPR — jsou součástí členství, které jste si zaplatili. Běžně je nečteme a nikdy je nepoužíváme k reklamě ani profilování. Konverzaci otevřeme jen tehdy, když je nahlášená, když vyšetřujeme konkrétní zneužití nebo bezpečnostní incident, nebo když to vyžaduje zákon. Nahlášení ukládá důvod, který jste vybrali, vaši nepovinnou poznámku a odkaz na to, co jste nahlásili — nikoli samostatnou kopii. Blokování se ukládá jako dvojice identifikátorů členů. Pokud si smažete účet, vaše zprávy odejdou s ním; kopie ve vlákně druhé osoby zůstává, zobrazená jako od odstraněného člena, protože ta konverzace je i jeho.</p></section><section id="privacy-14" class="lg-sec"><h2><i>14</i>AINUBIS, náš AI průvodce</h2><p>AINUBIS je AI průvodce uvnitř DOGYPTu. Jeho odpovědi generuje Claude, model společnosti Anthropic, PBC, která je naším zpracovatelem. Když jste přihlášení, s každou vaší zprávou pro AINUBISE odchází do Anthropicu také: jméno z vašeho profilu, jména a základní údaje vašich psů, údaje z jejich DOG ID (povaha, zdraví, krmení), poslední zápisy z jejich deníku a krátký výtah z vašich předchozích rozhovorů s AINUBISEM. AINUBIS nikdy nedostane závěť vašeho psa ani kontakty jiných lidí, které jste zapsali do DOG ID (veterinář, záložní kontakt, dědic). Anthropic tyto údaje dostává jen k vygenerování odpovědi a nepoužívá je k trénování svých modelů. Pokud přihlášení nejste, AINUBIS ví jen to, co mu napíšete do chatu, a snímek obrazovky, pokud ho přiložíte.

Každou z těchto částí — psy, DOG ID, deník a paměť — si budete moci vypnout v nastavení AINUBISE. AINUBIS pak pracuje jen s tím, co mu řeknete v rozhovoru.

Rozhovory s AINUBISEM včetně přiložených snímků uchováváme v naší databázi (Supabase) jako běžnou historii. Když si rozhovor v chatu skryjete nebo smažete, zmizí z vašeho pohledu, ne z našich záznamů; historii smažeme, když nás požádáte o zrušení účtu. Na rozdíl od zpráv mezi Členy (článek 13) nejsou rozhovory s AINUBISEM před námi uzavřené: zakladatel Matej Stacho je čte a může do nich sám odpovídat. Právní základ: u Členů čl. 6 odst. 1 písm. b) GDPR — AINUBIS je součástí členství; u nepřihlášených návštěvníků náš oprávněný zájem odpovědět na jejich otázku (čl. 6 odst. 1 písm. f)).</p></section></div><footer class="lg-foot"><p class="lg-motto" style="font-family: &quot;Space Grotesk&quot;, sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;">DOGYPT · Věříme ve psa</p><a class="lg-other" href="/terms">Podmínky používání →</a></footer></article><p class="lg-copy">© 2026 DOGYPT</p></main></div></template><template data-pre-consent="cs"><div class="consent-banner" role="dialog" aria-live="polite" aria-label="Lidské povinnosti"><div class="consent-inner"><div><p class="consent-body"><img class="consent-bone" src="/icons/pack/bone.svg" alt="" aria-hidden="true"><b>Lidské povinnosti</b>Jediné cookies, které doporučujeme, nejsou k jídlu — pomáhají nám vylepšovat web. Děkujeme.</p></div><div class="consent-actions"><div class="consent-split"><button type="button" class="consent-split-main">Jen nezbytné</button><button type="button" class="consent-split-arrow" aria-haspopup="menu" aria-expanded="false" aria-label="Vybrat si"><span class="consent-arrow-ic" aria-hidden="true"><svg viewBox="0 0 462.85 462.851" width="16" height="16" fill="currentColor" focusable="false" aria-hidden="true"><path d="M380.44,70.332c-0.376-4.936-3.362-9.46-7.663-12.781c-20.216-15.615-39.745-32.078-58.676-49.234
