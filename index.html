         Všetko denied; consent.ts po voľbe v banneri (Vlna B) pošle gtag('consent','update').
         Vracajúcemu userovi obnovíme uloženú voľbu synchronne z localStorage PRED GTM tagmi,
         nech GA4/Pixel nečakajú na React mount. Kľúč `dogypt_consent` = zhodný s consent.ts. -->

      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      try {
        var _c = JSON.parse(localStorage.getItem('dogypt_consent') || 'null');
        if (_c) gtag('consent', 'update', {
          analytics_storage: _c.analytics ? 'granted' : 'denied',
          ad_storage:        _c.marketing ? 'granted' : 'denied',
          ad_user_data:      _c.marketing ? 'granted' : 'denied',
          ad_personalization:_c.marketing ? 'granted' : 'denied'
        });
      } catch (e) {}
    </script>

    <!-- 🔴 ÚVODNÁ OPONA /onepage (Matej 28. 9. 2026: *„úvodné načítanie planéty je
         divne roztiahnuté… nevyzerá to profi — loader?"*). Zmerané: ~3 s čierna (JS
         sa ešte nestiahol), potom prázdny papyrus s lištou a šípkami a až potom guľa.
         Opona je v HTML, takže sa vykreslí s prvým bajtom — nečaká na React. Zdvihne
         ju udalosť `dogypt:planet-ready` (DogPlanetLab, keď je predná pologuľa
         načítaná) a guľa sa pod ňou práve vynára. Strop 9 s pre prípad chyby.
         🐾 LABKY PO KRUHU (Matej 5. 10. 2026: „daj 4“, nákres
         plany/nakres-loader-onepage-2026-10-05.html). 8 stôp z kitu okolo loga + %.
         Labky nesvietia podľa časovača, ale podľa 4 ZMERANÝCH zastávok (podiel z 8):
         15 opona stojí · 40 JS sa vykonal (DOMContentLoaded) · 70 film je v DOM
         (.op-root) · 100 planéta hotová. Číslo % bolo v prvej verzii — Matej
         5. 10.: „daj to bez %“. -->
    <script>
      (function () {
        if (location.pathname !== '/onepage') return;
        var css = document.createElement('style');
        css.textContent =
          '#op-boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;'
          + 'background:radial-gradient(58% 52% at 50% 46%,#FFF9EA 0%,#F6EACB 42%,#E6CF9C 100%);'
          + 'transition:opacity .9s cubic-bezier(.65,0,.35,1),visibility 0s linear .9s}'
          + '#op-boot .b{display:flex;flex-direction:column;align-items:center;gap:28px;'
          + 'animation:opBootIn 1s cubic-bezier(.2,.8,.2,1) both}'
          + '#op-boot .l{position:relative;width:132px;height:132px}'
          + '#op-boot .l img{width:100%;height:100%;object-fit:contain;display:block;'
          /* TMAVÉ LOGO NA PAPYRUSE (Matej 3. 10. 2026: „zlatá na bielom zaniká — aj pri loaderi
             /onepage musí byť logo tmavé"). Ten istý filter ako lišta heroflowu (flowPaleSkin.ts). */
          + 'filter:brightness(.34) sepia(1) saturate(2.2) hue-rotate(-12deg) drop-shadow(0 10px 24px rgba(122,90,42,.22))}'
          /* Zlatý odlesk prechádza CEZ kresbu loga (maska = logo), nie cez štvorec. */
          + '#op-boot .l::after{content:"";position:absolute;inset:0;'
          + 'background:linear-gradient(105deg,transparent 35%,rgba(255,244,210,.95) 50%,transparent 65%) no-repeat;'
          + 'background-size:250% 100%;animation:opBootShine 2.6s cubic-bezier(.45,0,.2,1) infinite .4s;'
          + '-webkit-mask:url(/images/dogypt-gold-logo.webp) center/contain no-repeat;mask:url(/images/dogypt-gold-logo.webp) center/contain no-repeat}'
          /* Obežná dráha: logo v strede, 8 labiek na kružnici. Labka = paw-full.svg z kitu (maska). */
          + '#op-boot .o{position:relative;width:224px;height:224px;display:grid;place-items:center}'
          + '#op-boot .o .l{width:112px;height:112px}'
          + '#op-boot .p{position:absolute;left:50%;top:50%;width:20px;height:21px;margin:-10px 0 0 -10px;'
          + 'background:#7A5A2A;opacity:.12;transition:opacity .35s ease,background-color .35s ease;'
          + '-webkit-mask:url(/icons/pack/paw-full.svg) center/contain no-repeat;mask:url(/icons/pack/paw-full.svg) center/contain no-repeat}'
          + '#op-boot .p.on{opacity:.85;background:#A3782B;animation:opBootPaw .45s cubic-bezier(.2,.8,.2,1)}'
          + '#op-boot.out{opacity:0;visibility:hidden}'
          + '#op-boot.out .b{opacity:0;transform:scale(1.08);filter:blur(4px);'
          + 'transition:opacity .6s ease,transform .9s cubic-bezier(.65,0,.35,1),filter .6s ease}'
          + '@keyframes opBootIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}'
          + '@keyframes opBootShine{from{background-position:150% 0}to{background-position:-50% 0}}'
          + '@keyframes opBootPaw{from{filter:brightness(1.7);transform:var(--r) scale(.7)}to{transform:var(--r)}}'
          + '@media (prefers-reduced-motion:reduce){#op-boot .l::after,#op-boot .p.on{animation:none}}';
        document.head.appendChild(css);
        var el = document.createElement('div');
        el.id = 'op-boot'; el.setAttribute('aria-hidden', 'true');
        var paws = '';
        for (var i = 0; i < 8; i++) {
          // Kráča v smere hodinových ručičiek; striedavo ľavá/pravá (±12°), aby to bola chôdza, nie ozubené koleso.
          var r = 'rotate(' + (i * 45) + 'deg) translateY(-96px) rotate(' + (90 + (i % 2 ? 12 : -12)) + 'deg)';
          paws += '<span class="p" style="--r:' + r + ';transform:' + r + '"></span>';
        }
        el.innerHTML = '<div class="b"><div class="o">' + paws
          + '<div class="l"><img src="/images/dogypt-gold-logo.webp" alt="" fetchpriority="high"></div></div></div>';
        var t0 = Date.now(), gone = false, pct = 0;
        var pawEls = el.querySelectorAll('.p');
        // Postup ide len DOPREDU; labky sa rozsvietia podľa podielu z 8.
        var stage = function (p) {
          if (p <= pct) return;
          pct = p;
          for (var k = 0; k < pawEls.length; k++) if (k < Math.round(p / 100 * 8)) pawEls[k].classList.add('on');
        };
        stage(15);
        document.addEventListener('DOMContentLoaded', function () { stage(40); });
        var mo = new MutationObserver(function () {
          if (document.querySelector('.op-root')) { stage(70); mo.disconnect(); }
        });
        mo.observe(document.documentElement, { childList: true, subtree: true });
        var lift = function () {
          if (gone) return; gone = true; mo.disconnect();
          stage(100);
          // Posledné labky musí oko stihnúť vidieť, inak opona odíde s neúplným kruhom.
          setTimeout(function () {
            el.classList.add('out');
            setTimeout(function () { el.remove(); }, 1000);
          }, Math.max(550, 900 - (Date.now() - t0)));
        };
        window.addEventListener('dogypt:planet-ready', lift);
        setTimeout(lift, 9000);
        // Film sa nevykreslil (produkcia bez preview tokenu, chyba) — opona nesmie
        // visieť nad prázdnou stránkou. Po `load` sa pozrie, či film existuje.
        window.addEventListener('load', function () {
          setTimeout(function () { if (!document.querySelector('.op-root')) lift(); }, 1500);
        });
        document.body.appendChild(el);
      })();
    </script>
