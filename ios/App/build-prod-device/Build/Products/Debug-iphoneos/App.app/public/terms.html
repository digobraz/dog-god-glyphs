is the order we deliver — we will not change scope or price after the fact.</p></section><section id="terms-6" class="lg-sec"><h2><i>6</i>Refunds &amp; Right of Withdrawal</h2><p>Under EU Directive 2011/83/EU consumers normally have 14 days to withdraw from a distance contract. Because the HEROGLYPH is delivered as digital content immediately after payment, by clicking “Pay” you give your express prior consent to immediate performance and acknowledge that you thereby lose your right of withdrawal as soon as delivery begins (Art. 16(m) of the Directive). If something on our side goes wrong — a broken file, a duplicate charge, a cancelled order — write to woof@dogypt.com within 14 days and we will refund or re-deliver, no questions asked.</p></section><section id="terms-7" class="lg-sec"><h2><i>7</i>Acceptable Use</h2><p>Don’t upload anything you don’t have the right to upload. That includes other people’s photos, copyrighted material, or content depicting cruelty, illegal activity, or sexual content involving minors. Don’t harass, impersonate, or threaten other Members. Don’t scrape, mass-download, reverse-engineer, or attempt to disrupt the Service. We may remove content or accounts that break these rules, with or without notice.</p></section><section id="terms-8" class="lg-sec"><h2><i>8</i>Liability &amp; Disclaimers</h2><p>The HEROGLYPH is a symbolic, ceremonial product — it is not veterinary, medical, behavioural, or breeding advice. The Service is provided “as is”. To the maximum extent allowed by Slovak and EU law, our total liability for any claim arising from the Service is limited to the amount you paid us in the 12 months before the claim. Nothing here limits liability for fraud, gross negligence, or rights that cannot be waived under applicable law.</p></section><section id="terms-9" class="lg-sec"><h2><i>9</i>Changes to These Terms</h2><p>We may update these Terms as the Service grows. Material changes will be announced by email at least 30 days before they take effect. Minor clarifications take effect on publication. Continued use of the Service after the effective date means you accept the new Terms. Older versions are kept on file and available on request.</p></section><section id="terms-10" class="lg-sec"><h2><i>10</i>Governing Law &amp; Disputes</h2><p>These Terms are governed by the laws of the Slovak Republic, excluding its conflict-of-law rules. Disputes that cannot be resolved informally fall under the jurisdiction of the competent Slovak courts at our registered seat. EU consumers may also use the European Online Dispute Resolution platform at https://ec.europa.eu/consumers/odr.</p></section><section id="terms-11" class="lg-sec"><h2><i>11</i>Contact</h2><p>woof@dogypt.com · Postal: DOGYPT s.r.o., Jaslovské Bohunice 335, 919 30 Jaslovské Bohunice, Slovakia.</p></section><section id="terms-12" class="lg-sec"><h2><i>12</i>Content You Post</h2><p>Alongside your HEROGLYPH you can post content inside the Pack: trip photos, routes and locations, trip descriptions, ratings, comments and questions, and whatever you write on your profile. When you mark a trip as walked, other Members see your first name and the dogs who walked it with you. You keep ownership of everything you post. By posting it you give DOGYPT s.r.o. a worldwide, royalty-free, non-exclusive licence to store, display and adapt that content for the purpose of running and promoting the Service — for example showing your trip photo on the map, in a trip listing, or on a share card. The licence lasts while the content is on the Service; remove the content or your account and it ends, except for backups, which expire on their normal cycle. We do not sell your content and we do not license it to anyone else for their own use. Only post what you have the right to post — that includes photos taken by someone else and people who are recognisable in them.</p></section><section id="terms-13" class="lg-sec"><h2><i>13</i>Messages Between Members</h2><p>Members can write to each other directly. Messages are private between the participants — we do not read them routinely and never use them for advertising. They are stored on our servers so the conversation is still there when you come back, and we can read a conversation in three cases: when someone reports it, when we investigate a specific abuse or security incident, or when the law requires it. You can block another Member at any time; blocking is immediate and works both ways. Treat messages as you would any online conversation — do not send payment details, passwords, or documents you would not want stored.</p></section><section id="terms-14" class="lg-sec"><h2><i>14</i>Reporting &amp; Moderation</h2><p>Profiles, trips and conversations can be reported. A report goes to us and a human reads it — today that is the founder, Matej Stacho. We aim to look at every report within 7 days. Depending on what we find we may do nothing, remove the content, warn the Member, limit what they can post, or close their account. If we act on your content we will tell you why by email, and you can reply and dispute it. We may also remove content on our own initiative when it breaks Section 7. Deliberate or repeated abuse — harassment, spam, fake trips, content involving minors — ends the account without further warning.</p></section></div><footer class="lg-foot"><p class="lg-motto" style="font-family: &quot;Space Grotesk&quot;, sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;">DOGYPT · In DOG We Trust</p><a class="lg-other" href="/privacy">Privacy Policy →</a></footer></article><p class="lg-copy">© 2026 DOGYPT</p></main></div></template><template data-pre-consent="en"><div class="consent-banner" role="dialog" aria-live="polite" aria-label="Human duties"><div class="consent-inner"><div><p class="consent-body"><img class="consent-bone" src="/icons/pack/bone.svg" alt="" aria-hidden="true"><b>Human duties</b>The only cookies we recommend aren’t H procesu alebo akejkoľvek súvisiacej služby (spolu „Služba“) súhlasíte s týmito Podmienkami. Dátum účinnosti: 4. mája 2026.</p></section><section id="terms-2" class="lg-sec"><h2><i>2</i>Kto môže Službu používať</h2><p>Službu môžete používať, len ak máte aspoň 16 rokov. Vytvorením účtu alebo dokončením nákupu potvrdzujete, že máte 16 a viac rokov, že údaje, ktoré poskytujete, sú pravdivé, a že používanie Služby je v krajine, kde žijete, zákonné.</p></section><section id="terms-3" class="lg-sec"><h2><i>3</i>Účet a členstvo vo svorke</h2><p>Prístup sa udeľuje cez prihlasovací odkaz (magic link) odoslaný na váš e-mail; žiadne heslo sa neukladá. Účet je osobný — prosíme, nezdieľajte prístup. Účty, ktoré zneužívajú Službu, obťažujú iných Členov alebo porušujú tieto Podmienky, môžeme pozastaviť alebo zrušiť. O vymazanie účtu môžete kedykoľvek požiadať e-mailom na woof@dogypt.com.</p></section><section id="terms-4" class="lg-sec"><h2><i>4</i>Heroglyph a digitálny tovar</h2><p>Kupujete digitálny tovar: osobný HEROGLYPH (jedinečný symbolický certifikát), jeho PDF verziu, záznam vášho psa vo verejnom GodsGrid a trvalý prístup k profilu vašej svorky. Udeľujeme vám osobnú, neprenosnú a nevýhradnú licenciu na používanie tohto digitálneho tovaru na nekomerčné osobné účely. Nič fyzické sa neposiela. Reprodukcia, ďalší predaj alebo komerčné využitie HEROGLYPH grafiky či podkladov vyžaduje náš predchádzajúci písomný súhlas.</p></section><section id="terms-5" class="lg-sec"><h2><i>5</i>Platby</h2><p>Platby spracúva Stripe Payments Europe, Ltd. Vaše úplné údaje o karte nikdy nevidíme ani neukladáme. Ceny sa zobrazujú v mene uvedenej pri pokladni (predvolene USD); prípadná DPH sa vypočíta a zobrazí pred zaplatením. Objednávka, ktorú potvrdíte pri pokladni, je objednávka, ktorú doručíme — rozsah ani cenu dodatočne nemeníme.</p></section><section id="terms-6" class="lg-sec"><h2><i>6</i>Vrátenie peňazí a právo na odstúpenie</h2><p>Podľa smernice EÚ 2011/83/EÚ majú spotrebitelia spravidla 14 dní na odstúpenie od zmluvy uzavretej na diaľku. Keďže HEROGLYPH sa dodáva ako digitálny obsah ihneď po zaplatení, kliknutím na „Zaplatiť“ udeľujete výslovný predchádzajúci súhlas so začatím okamžitého plnenia a beriete na vedomie, že začatím dodania strácate právo na odstúpenie (čl. 16 písm. m) smernice). Ak sa niečo pokazí na našej strane — poškodený súbor, duplicitná platba, zrušená objednávka — napíšte na woof@dogypt.com do 14 dní a peniaze vrátime alebo dodáme znova, bez otázok.</p></section><section id="terms-7" class="lg-sec"><h2><i>7</i>Prípustné používanie</h2><p>Nenahrávajte nič, na čo nemáte právo. Patria sem fotografie iných ľudí, materiál chránený autorským právom alebo obsah zobrazujúci týranie, nezákonnú činnosť či sexuálny obsah s maloletými. Neobťažujte iných Členov, nevydávajte sa za nich a nevyhrážajte sa im. Nezbierajte dáta automatizovane (scraping), hromadne nesťahujte, nevykonávajte spätné inžinierstvo ani sa nepokúšajte narušiť prevádzku Služby. Obsah alebo účty porušujúce tieto pravidlá môžeme odstrániť, s upozornením aj bez neho.</p></section><section id="terms-8" class="lg-sec"><h2><i>8</i>Zodpovednosť a vyhlásenia</h2><p>HEROGLYPH je symbolický, ceremoniálny produkt — nie je to veterinárne, medicínske, behaviorálne ani chovateľské poradenstvo. Služba sa poskytuje „tak, ako je“. V maximálnom rozsahu povolenom slovenským právom a právom EÚ je naša celková zodpovednosť za akýkoľvek nárok vyplývajúci zo Služby obmedzená na sumu, ktorú ste nám zaplatili za 12 mesiacov pred vznikom nároku. Nič v týchto Podmienkach neobmedzuje zodpovednosť za podvod, hrubú nedbanlivosť ani práva, ktorých sa podľa platného práva nemožno vzdať.</p></section><section id="terms-9" class="lg-sec"><h2><i>9</i>Zmeny týchto Podmienok</h2><p>Tieto Podmienky môžeme s rastom Služby aktualizovať. Podstatné zmeny oznámime e-mailom najmenej 30 dní pred nadobudnutím účinnosti. Drobné spresnenia nadobúdajú účinnosť zverejnením. Pokračovaním v používaní Služby po dátume účinn aj po vašom návrate, a prečítať si ju môžeme v troch prípadoch: keď ju niekto nahlási, keď vyšetrujeme konkrétne zneužitie alebo bezpečnostný incident, alebo keď to vyžaduje zákon. Iného Člena môžete kedykoľvek zablokovať; blokovanie je okamžité a platí obojstranne. So správami zaobchádzajte ako s akoukoľvek online konverzáciou — neposielajte platobné údaje, heslá ani dokumenty, o ktorých nechcete, aby boli uložené.</p></section><section id="terms-14" class="lg-sec"><h2><i>14</i>Nahlasovanie a moderovanie</h2><p>Profily, výlety aj konverzácie sa dajú nahlásiť. Nahlásenie príde k nám a prečíta ho človek — dnes je to zakladateľ Matej Stacho. Naším cieľom je pozrieť si každé nahlásenie do 7 dní. Podľa toho, čo zistíme, môžeme neurobiť nič, obsah odstrániť, Člena upozorniť, obmedziť, čo môže zverejňovať, alebo mu účet zrušiť. Ak zasiahneme do vášho obsahu, dôvod vám oznámime e-mailom a môžete odpovedať a namietať. Obsah môžeme odstrániť aj z vlastnej iniciatívy, ak porušuje článok 7. Úmyselné alebo opakované zneužitie — obťažovanie, spam, falošné výlety, obsah týkajúci sa maloletých — znamená zrušenie účtu bez ďalšieho upozornenia.</p></section></div><footer class="lg-foot"><p class="lg-motto" style="font-family: &quot;Space Grotesk&quot;, sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;">DOGYPT · Veríme v psa</p><a class="lg-other" href="/privacy">Zásady ochrany súkromia →</a></footer></article><p class="lg-copy">© 2026 DOGYPT</p></main></div></template><template data-pre-consent="sk"><div class="consent-banner" role="dialog" aria-live="polite" aria-label="Ľudské povinnosti"><div class="consent-inner"><div><p class="consent-body"><img class="consent-bone" src="/icons/pack/bone.svg" alt="" aria-hidden="true"><b>Ľudské povinnosti</b>Jediné cookies, ktoré odporúčame, nie sú na jedenie — pomáhajú nám vylepšovať web. Ďakujeme.</p></div><div class="consent-actions"><div class="consent-split"><button type="button" class="consen e se HEROGLYPH dodává jako digitální obsah ihned po zaplacení, kliknutím na „Zaplatit“ udělujete výslovný předchozí souhlas se zahájením okamžitého plnění a berete na vědomí, že zahájením dodání ztrácíte právo na odstoupení (čl. 16 písm. m) směrnice). Pokud se něco pokazí na naší straně — poškozený soubor, duplicitní platba, zrušená objednávka — napište na woof@dogypt.com do 14 dnů a peníze vrátíme nebo dodáme znovu, bez otázek.</p></section><section id="terms-7" class="lg-sec"><h2><i>7</i>Přípustné používání</h2><p>Nenahrávejte nic, k čemu nemáte práva. Patří sem fotografie jiných lidí, materiál chráněný autorským právem nebo obsah zobrazující týrání, nezákonnou činnost či sexuální obsah s nezletilými. Neobtěžujte jiné Členy, nevydávejte se za ně a nevyhrožujte jim. Nesbírejte data automatizovaně (scraping), hromadně nestahujte, neprovádějte zpětné inženýrství ani se nepokoušejte narušit provoz Služby. Obsah nebo účty porušující tato pravidla můžeme odstranit, s upozorněním i bez něj.</p></section><section id="terms-8" class="lg-sec"><h2><i>8</i>Odpovědnost a prohlášení</h2><p>HEROGLYPH je symbolický, ceremoniální produkt — není to veterinární, lékařské, behaviorální ani chovatelské poradenství. Služba se poskytuje „tak, jak je“. V maximálním rozsahu povoleném slovenským právem a právem EU je naše celková odpovědnost za jakýkoli nárok vyplývající ze Služby omezena na částku, kterou jste nám zaplatili za 12 měsíců před vznikem nároku. Nic v těchto Podmínkách neomezuje odpovědnost za podvod, hrubou nedbalost ani práva, kterých se podle platného práva nelze vzdát.</p></section><section id="terms-9" class="lg-sec"><h2><i>9</i>Změny těchto Podmínek</h2><p>Tyto Podmínky můžeme s růstem Služby aktualizovat. Podstatné změny oznámíme e-mailem nejméně 30 dní před nabytím účinnosti. Drobná upřesnění nabývají účinnosti zveřejněním. Pokračováním v používání Služby po datu účinnosti nové Podmínky přijímáte. Starší verze archivujeme a na vyžádání zpřístupníme.</p></section><section id="terms-10" class="lg-sec"><h2><i>10</i>Rozhodné právo a spory</h2><p>Tyto Podmínky se řídí právem Slovenské republiky s vyloučením kolizních norem. Spory, které se nepodaří vyřešit neformálně, spadají do pravomoci příslušných slovenských soudů podle našeho sídla. Spotřebitelé v EU mohou využít také evropskou platformu pro řešení sporů online na https://ec.europa.eu/consumers/odr.</p></section><section id="terms-11" class="lg-sec"><h2><i>11</i>Kontakt</h2><p>woof@dogypt.com · Pošta: DOGYPT s.r.o., Jaslovské Bohunice 335, 919 30 Jaslovské Bohunice, Slovensko.</p></section><section id="terms-12" class="lg-sec"><h2><i>12</i>Obsah, který zveřejňujete</h2><p>Vedle svého HEROGLYPHu můžete ve smečce zveřejňovat obsah: fotografie z výletů, trasy a místa, popisy výletů, hodnocení, komentáře a dotazy a cokoli napíšete na svůj profil. Když označíte výlet jako ušlý, ostatní Členové uvidí vaše křestní jméno a psy, kteří jej ušli s vámi. Všechno, co zveřejníte, zůstává vaše. Zveřejněním udělujete společnosti DOGYPT s.r.o. celosvětovou, bezúplatnou, nevýhradní licenci tento obsah uchovávat, zobrazovat a upravovat pro účely provozu a propagace Služby — například zobrazit vaši fotografii z výletu na mapě, ve výpisu výletů nebo na sdílecí kartě. Licence trvá, dokud je obsah ve Službě; odstraněním obsahu nebo účtu zaniká, s výjimkou záloh, které vyprší ve svém běžném cyklu. Váš obsah neprodáváme a neposkytujeme na něj licenci nikomu jinému pro jeho vlastní použití. Zveřejňujte jen to, k čemu máte právo — včetně fotografií, které pořídil někdo jiný, a lidí, kteří jsou na nich rozpoznatelní.</p></section><section id="terms-13" class="lg-sec"><h2><i>13</i>Zprávy mezi Členy</h2><p>Členové si mohou psát přímo. Zprávy jsou soukromé mezi účastníky — běžně je nečteme a nikdy je nepoužíváme k reklamě. Ukládají se na našich serverech, aby tam konverzace byla i po vašem návratu, a přečíst si ji můžeme ve třech případech: když ji někdo nahlásí, když vyšetřujeme konkrétní zneužití nebo bezpečnostní incident, nebo když to vyžaduje zákon. Jiného Člena můžete kdykoli zablokovat; blokování je okamžité a platí oboustranně. Se zprávami zacházejte jako s jakoukoli online konverzací — neposílejte platební údaje, hesla ani dokumenty, o kterých nechcete, aby byly uložené.</p></section><section id="terms-14" class="lg-sec"><h2><i>14</i>Nahlašování a moderování</h2><p>Profily, výlety i konverzace lze nahlásit. Nahlášení přijde k nám a přečte je člověk — dnes je to zakladatel Matej Stacho. Naším cílem je podívat se na každé nahlášení do 7 dnů. Podle toho, co zjistíme, můžeme neudělat nic, obsah odstranit, Člena upozornit, omezit, co může zveřejňovat, nebo mu účet zrušit. Pokud zasáhneme do vašeho obsahu, důvod vám oznámíme e-mailem a můžete odpovědět a namítat. Obsah můžeme odstranit i z vlastní iniciativy, pokud porušuje článek 7. Úmyslné nebo opakované zneužití — obtěžování, spam, falešné výlety, obsah týkající se nezletilých — znamená zrušení účtu bez dalšího upozornění.</p></section></div><footer class="lg-foot"><p class="lg-motto" style="font-family: &quot;Space Grotesk&quot;, sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;">DOGYPT · Věříme ve psa</p><a class="lg-other" href="/privacy">Zásady ochrany soukromí →</a></footer></article><p class="lg-copy">© 2026 DOGYPT</p></main></div></template><template data-pre-consent="cs"><div class="consent-banner" role="dialog" aria-live="polite" aria-label="Lidské povinnosti"><div class="consent-inner"><div><p class="consent-body"><img class="consent-bone" src="/icons/pack/bone.svg" alt="" aria-hidden="true"><b>Lidské povinnosti</b>Jediné cookies, které doporučujeme, nejsou k jídlu — pomáhají nám vylepšovat web. Děkujeme.</p></div><div class="consent-actions"><div class="consent-split"><button type="button" class="consent-split-main">Jen nezbytné</button><button type="button" class="consent-split-arrow" aria-haspopup="menu" aria-expanded="false" aria-label="Vybrat si"><span
