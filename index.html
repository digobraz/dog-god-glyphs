<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <title>DOGYPT — The Place Where DOG is GOD</title>
    <!-- description + og:title/description + twitter:title/description zámerne NIE statické: rieši ich per-route <Seo> (react-helmet-async) vrátane homepage (GodsGrid). Statická home hodnota by sa duplikovala na sub-stránkach popri per-route. -->
    <meta name="author" content="DOGYPT" />
    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/r1xjLvSkh4R0qFvw293HZyntcAI2/social-images/social-1778165377850-LOGO_DOGYPT_FINAL_web.webp">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@dogyptcom" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/r1xjLvSkh4R0qFvw293HZyntcAI2/social-images/social-1778165377850-LOGO_DOGYPT_FINAL_web.webp">
    <!-- canonical + og:url zámerne NIE statické: rieši ich per-route <Seo> (react-helmet-async), inak by statická home hodnota kolidovala s per-route canonical (Google by mohol canonicalizovať sub-stránky na home). Home sa self-canonicalizuje. -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo-favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts moved here from src/index.css @import (was render-blocking the whole
         stylesheet parse). Only the families/weights actually used across the app
         (Cinzel, Cinzel Decorative, Inter, Space Grotesk, JetBrains Mono).
         media="print" + onload swap = non-blocking load (PageSpeed 2026-07-08: 1750ms
         "žiadosti o blokovanie vykreslenia"); text still shows via display=swap fallback
         font in the meantime, no CLS since app already renders CLS=0. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      />
    </noscript>
    <!-- NOTE: /spiral/img/* preloads removed (2026-07 perf pass) — spirála je archívna /spiral
         stránka, homepage je GodsGrid a nepoužíva tieto assety. -->
    <!-- GodsGrid LCP candidates (PageSpeed 2026-07-08: "nepriame vyhľadávanie žiadostí LCP" —
         obe sa vykresľujú do canvasu až po JS mounte, prehliadač ich objaví neskoro bez preloadu). -->
    <link rel="preload" as="image" href="/images/dogypt-gold-logo.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hektor-grid.webp" fetchpriority="high" />
  <meta property="og:site_name" content="DOGYPT" />
  <meta property="og:locale" content="en_US" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://dogypt.com/#organization",
        "name": "DOGYPT",
        "alternateName": "Dogyptism",
        "url": "https://dogypt.com",
        "description": "DOGYPT is a movement for dog lovers. Every dog gets a unique Heroglyph — their permanent place in the global pack.",
        "logo": "https://storage.googleapis.com/gpt-engineer-file-uploads/r1xjLvSkh4R0qFvw293HZyntcAI2/social-images/social-1778165377850-LOGO_DOGYPT_FINAL_web.webp",
        "sameAs": ["https://twitter.com/dogyptcom"]
      },
      {
        "@type": "WebSite",
        "@id": "https://dogypt.com/#website",
        "name": "DOGYPT",
        "url": "https://dogypt.com",
        "publisher": { "@id": "https://dogypt.com/#organization" }
      }
    ]
  }
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
